[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "seqout-fetch"
version = "0.1.0"
authors = [
  {name = "Joe Hoye Dow", email = "luxunisgod123@gmail.com"}
]
description = "Filter the seqout.org single-cell and spatial study tables and export them as CSV."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
  "bioinformatics",
  "single-cell",
  "spatial-transcriptomics",
  "geo",
  "cli",
]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
  "typer>=0.12",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/MaybeBio/seqout-fetch"
Issues = "https://github.com/MaybeBio/seqout-fetch/issues"

[project.scripts]
seqout-fetch = "seqout_fetch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/seqout_fetch"]

[tool.hatch.build.targets.sdist]
exclude = ["refers", "dist", ".pytest_cache", "*.egg-info", "**/__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
