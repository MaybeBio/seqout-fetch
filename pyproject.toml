[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seqout-fetch"
version = "0.1.0"
description = "Filter the seqout.org single-cell and spatial study tables and export them as CSV."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
  "bioinformatics",
  "single-cell",
  "spatial-transcriptomics",
  "geo",
  "cli",
]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "typer>=0.12",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
seqout-fetch = "seqout_fetch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/seqout_fetch"]

[tool.hatch.build.targets.sdist]
exclude = ["refers", "dist", ".pytest_cache", "*.egg-info", "**/__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
